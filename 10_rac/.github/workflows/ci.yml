name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Render views
        run: python render.py write
      - name: Strict gates
        run: python BumaoXTGL_Minimal_v01.py check --strict
      - name: Unit + reverse tests
        run: |
          python tests/test_output_guard.py
          python tests/test_capability.py
          python tests/test_pretool.py
          python tests/test_render.py
          python tests/test_reverse.py
